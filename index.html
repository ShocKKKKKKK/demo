<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<title>Демо недоступне</title>
	<style>
		:root {
			--stub-bg: #121214;
			--stub-fg: #ece7dd;
			--stub-muted: #928d84;
			--stub-accent: #c6a15b;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100svh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px 16px;
			font-family: system-ui, 'Segoe UI', Arial, sans-serif;
			color: var(--stub-fg);
			background-color: var(--stub-bg);
		}

		.stub {
			max-width: 520px;
			text-align: center;
		}

		.stub__title {
			margin: 0 0 16px;
			font-size: clamp(28px, 22px + 2vw, 40px);
			line-height: 1.15;
		}

		.stub__text {
			margin: 0 0 28px;
			font-size: 17px;
			line-height: 1.6;
			color: var(--stub-muted);
		}

		.stub__link {
			color: var(--stub-accent);
			text-underline-offset: 4px;
		}
	</style>
</head>
<body>
	<main class="stub">
		<h1 class="stub__title">Демо недоступне</h1>
		<p class="stub__text">Термін показу цього демо-сайту минув або посилання неповне. Якщо хочете побачити свій майбутній сайт — напишіть, зроблю нове демо.</p>
		<p class="stub__text"><a class="stub__link" href="https://webdevsergey.com/">webdevsergey.com</a></p>
	</main>
</body>
</html>
